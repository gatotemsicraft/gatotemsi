<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Pixel Fishing RPG MMO</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="game-container"></div>

    <div id="ui-overlay">
        <div id="stats-panel">
            <h3 id="player-title">Angler Novice</h3>
            <p>Coins: <span id="coin-val">100</span> G</p>
            <p>Total Ikan: <span id="fish-val">0</span></p>
            <button onclick="castRod()">🎣 Mancing (Cast)</button>
            <button onclick="openShop()">🛒 Shop / Gacha Rod</button>
        </div>

        <div id="skin-panel">
            <label>Upload Skin (16x16 PNG):</label>
            <input type="file" id="skinInput" accept="image/png" onchange="uploadSkin(event)">
        </div>

        <div id="chat-panel">
            <div id="chat-box"></div>
            <input type="text" id="chatInput" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') sendChat()">
        </div>
    </div>

    <!-- Retro Chiptune Background Music & Sound SFX via Web Audio CDN -->
    <audio id="bgm" loop autoplay>
        <source src="https://cdn.freesound.org/previews/561/561135_11861866-lq.mp3" type="audio/mp3">
    </audio>

    <script src="game.js"></script>
</body>
</html>
